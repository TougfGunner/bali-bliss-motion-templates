<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bali Bliss — Editorial Audio Suite</title>
  <style>
    :root {
      --bg: #0b0c0e;
      --card-bg: #131518;
      --card-border: #1f2328;
      --card-hover: #292e35;
      --text-main: #f0f2f5;
      --text-dim: #7d8590;
      --accent: #d4af37;
      --accent-dim: rgba(212, 175, 55, 0.12);
      --accent-glow: rgba(212, 175, 55, 0.25);
      --badge-bg: #1c2024;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 48px 24px 140px 24px;
      line-height: 1.5;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 32px;
    }

    .kicker {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--accent);
      margin-bottom: 8px;
      font-weight: 600;
    }

    h1 {
      font-size: 32px;
      font-weight: 400;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--text-dim);
      font-size: 15px;
    }

    .stats-bar {
      display: flex;
      gap: 24px;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--card-border);
      font-size: 13px;
      color: var(--text-dim);
    }

    .stats-bar span {
      color: var(--text-main);
      font-weight: 600;
    }

    /* Filter & Search Bar */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-dim);
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn:hover {
      border-color: var(--text-dim);
      color: var(--text-main);
    }

    .tab-btn.active {
      background: var(--accent-dim);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }

    .search-input {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 13px;
      min-width: 220px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    /* Track List */
    .track-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .track-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: border-color 0.2s ease, background 0.2s ease;
      cursor: pointer;
    }

    .track-card:hover {
      border-color: var(--card-hover);
      background: #16191d;
    }

    .track-card.active {
      border-color: var(--accent);
      background: var(--accent-dim);
    }

    .track-left {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1;
      min-width: 0;
    }

    .play-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #1d2126;
      border: 1px solid var(--card-border);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }

    .track-card:hover .play-btn {
      border-color: var(--accent);
      color: var(--accent);
    }

    .track-card.active .play-btn {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }

    .track-info {
      flex: 1;
      min-width: 0;
    }

    .track-title {
      font-size: 15px;
      font-weight: 500;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-desc {
      font-size: 12px;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-right {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
      margin-left: 16px;
    }

    .badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      background: var(--badge-bg);
      color: var(--text-dim);
      font-weight: 500;
    }

    .duration {
      font-size: 13px;
      color: var(--text-dim);
      font-variant-numeric: tabular-nums;
      min-width: 42px;
      text-align: right;
    }

    /* Equalizer wave icon */
    .eq-wave {
      display: none;
      align-items: flex-end;
      gap: 2px;
      height: 14px;
      width: 14px;
    }

    .track-card.active.playing .eq-wave {
      display: flex;
    }

    .eq-bar {
      width: 2px;
      background: var(--accent);
      border-radius: 1px;
      animation: eq 0.8s ease-in-out infinite alternate;
    }

    .eq-bar:nth-child(1) { height: 40%; animation-delay: 0.1s; }
    .eq-bar:nth-child(2) { height: 90%; animation-delay: 0.3s; }
    .eq-bar:nth-child(3) { height: 60%; animation-delay: 0.2s; }

    @keyframes eq {
      0% { height: 20%; }
      100% { height: 100%; }
    }

    /* Persistent Bottom Player */
    .player-dock {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 40px);
      max-width: 880px;
      background: rgba(19, 21, 24, 0.94);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 14px 22px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      z-index: 100;
    }

    .dock-left {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 200px;
      flex: 1;
    }

    .dock-play {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--accent);
      color: #000;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .dock-meta h3 {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 240px;
    }

    .dock-meta p {
      font-size: 12px;
      color: var(--text-dim);
    }

    .dock-center {
      flex: 2;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .progress-bar-container {
      flex: 1;
      height: 4px;
      background: #2a2e34;
      border-radius: 2px;
      cursor: pointer;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      width: 0%;
      transition: width 0.1s linear;
    }

    .time-stamp {
      font-size: 11px;
      color: var(--text-dim);
      font-variant-numeric: tabular-nums;
      min-width: 36px;
    }

    .dock-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .vol-slider {
      width: 80px;
      accent-color: var(--accent);
      cursor: pointer;
    }
  </style>
</head>

  </div>

    let currentTrackIndex = -1;
    let isPlaying = false;
    let activeFilter = "all";
    let searchQuery = "";

    const audio = document.getElementById("global-audio");
    const trackListEl = document.getElementById("track-list");
    const dockPlayBtn = document.getElementById("dock-play-btn");
    const dockPlayIcon = document.getElementById("dock-play-icon");
    const dockTitle = document.getElementById("dock-title");
    const dockCategory = document.getElementById("dock-category");
    const dockCurTime = document.getElementById("dock-cur-time");
    const dockDurTime = document.getElementById("dock-dur-time");
    const dockProgWrap = document.getElementById("dock-prog-wrap");
    const dockProgFill = document.getElementById("dock-prog-fill");
    const volSlider = document.getElementById("vol-slider");
    const searchBox = document.getElementById("search-box");
    const tabBtns = document.querySelectorAll(".tab-btn");

    function formatTime(secs) {
      if (!secs || isNaN(secs)) return "0:00";
      const m = Math.floor(secs / 60);
      const s = Math.floor(secs % 60);
      return m + ":" + (s < 10 ? "0" : "") + s;
    }

    function renderTracks() {
      trackListEl.innerHTML = "";
      const filtered = TRACKS.filter((t, idx) => {
        const matchesCat = activeFilter === "all" || t.category === activeFilter;
        const matchesSearch = !searchQuery || t.title.toLowerCase().includes(searchQuery) || (t.description && t.description.toLowerCase().includes(searchQuery));
        return matchesCat && matchesSearch;
      });

      filtered.forEach((t) => {
        const originalIndex = TRACKS.indexOf(t);
        const isActive = originalIndex === currentTrackIndex;
        const isThisPlaying = isActive && isPlaying;

        const card = document.createElement("div");
        card.className = "track-card" + (isActive ? " active" : "") + (isThisPlaying ? " playing" : "");
        card.onclick = () => playTrack(originalIndex);

        card.innerHTML = `
          <div class="track-left">
            <button class="play-btn" onclick="event.stopPropagation(); playTrack(${originalIndex});">
              ${isThisPlaying ? 
                `<svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>` : 
                `<svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`}
            </button>
            <div class="track-info">
              <div class="track-title">${t.title}</div>
              <div class="track-desc">${t.description || ""}</div>
            </div>
          </div>
          <div class="track-right">
            <div class="eq-wave">
              <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
            </div>
            <span class="badge">${t.category}</span>
            <span class="duration">${formatTime(t.duration_sec)}</span>
          </div>
        `;
        trackListEl.appendChild(card);
      });
    }

    function playTrack(idx) {
      if (currentTrackIndex === idx) {
        if (isPlaying) {
          audio.pause();
        } else {
          audio.play();
        }
        return;
      }

      currentTrackIndex = idx;
      const t = TRACKS[idx];
      audio.src = t.path;
      dockTitle.textContent = t.title;
      dockCategory.textContent = t.category + " · " + (t.description || "");
      dockDurTime.textContent = formatTime(t.duration_sec);
      audio.play().catch(e => console.log("Autoplay blocked:", e));
      renderTracks();
    }

    audio.onplay = () => {
      isPlaying = true;
      dockPlayIcon.innerHTML = `<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>`;
      renderTracks();
    };

    audio.onpause = () => {
      isPlaying = false;
      dockPlayIcon.innerHTML = `<path d="M8 5v14l11-7z"/>`;
      renderTracks();
    };

    audio.ontimeupdate = () => {
      dockCurTime.textContent = formatTime(audio.currentTime);
      const pct = (audio.currentTime / audio.duration) * 100 || 0;
      dockProgFill.style.width = pct + "%";
    };

    audio.onended = () => {
      // Play next in tracklist
      if (currentTrackIndex < TRACKS.length - 1) {
        playTrack(currentTrackIndex + 1);
      } else {
        isPlaying = false;
        dockPlayIcon.innerHTML = `<path d="M8 5v14l11-7z"/>`;
        renderTracks();
      }
    };

    dockPlayBtn.onclick = () => {
      if (currentTrackIndex === -1) {
        playTrack(0);
      } else {
        if (isPlaying) audio.pause();
        else audio.play();
      }
    };

    dockProgWrap.onclick = (e) => {
      const rect = dockProgWrap.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const ratio = clickX / rect.width;
      audio.currentTime = ratio * audio.duration;
    };

    volSlider.oninput = () => {
      audio.volume = volSlider.value;
    };

    tabBtns.forEach(btn => {
      btn.onclick = () => {
        tabBtns.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        activeFilter = btn.dataset.cat;
        renderTracks();
      };
    });

    searchBox.oninput = (e) => {
      searchQuery = e.target.value.toLowerCase().trim();
      renderTracks();
    };

    // Spacebar to pause/play
    window.addEventListener("keydown", (e) => {
      if (e.target.tagName === "INPUT") return;
      if (e.code === "Space") {
        e.preventDefault();
        dockPlayBtn.click();
      }
    });

    renderTracks();
  </script>
