<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bali Bliss — Editorial Audio Suite</title>
  <style>
    :root {
      --bg: #0a0b0d;
      --card-bg: #131518;
      --card-border: #1f2328;
      --card-hover: #2d333b;
      --accent: #c5a880;
      --accent-dim: rgba(197, 168, 128, 0.15);
      --text-main: #f0f2f5;
      --text-dim: #8b929a;
      --badge-bg: #1a1e24;
      --danger: #ff6b6b;
      --danger-dim: rgba(255, 107, 107, 0.12);
      --danger-border: rgba(255, 107, 107, 0.3);
      --success: #4ade80;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding-bottom: 120px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 1040px;
      margin: 0 auto;
      padding: 40px 24px;
    }

    /* Header */
    header {
      margin-bottom: 32px;
    }

    .kicker {
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 8px;
      font-weight: 600;
    }

    h1 {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--text-dim);
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .stats-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      padding: 12px 18px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      font-size: 12px;
      color: var(--text-dim);
    }

    .stats-bar span {
      color: var(--text-main);
      font-weight: 600;
      margin-left: 4px;
    }

    .stat-badge-active {
      color: var(--success) !important;
    }

    .stat-badge-deleted {
      color: var(--danger) !important;
    }

    /* Filter & Search Bar */
    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 24px;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tab-btn {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-dim);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn:hover {
      border-color: var(--text-dim);
      color: var(--text-main);
    }

    .tab-btn.active {
      background: var(--accent-dim);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }

    .tab-btn.tab-deleted.active {
      background: var(--danger-dim);
      border-color: var(--danger);
      color: var(--danger);
    }

    .search-input {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 13px;
      min-width: 220px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    /* Track List Grid */
    .track-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .track-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: border-color 0.2s ease, background 0.2s ease, opacity 0.2s ease;
      cursor: pointer;
    }

    .track-card:hover {
      border-color: var(--card-hover);
      background: #16191d;
    }

    .track-card.active {
      border-color: var(--accent);
      background: var(--accent-dim);
    }

    /* Marked deleted card styling */
    .track-card.is-deleted {
      opacity: 0.42;
      border-color: var(--danger-border);
      background: rgba(255, 107, 107, 0.03);
    }

    .track-card.is-deleted:hover {
      opacity: 0.85;
      border-color: var(--danger);
    }

    .track-card.is-deleted .track-title {
      text-decoration: line-through;
      color: var(--text-dim);
    }

    .track-left {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1;
      min-width: 0;
    }

    .play-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #1d2126;
      border: 1px solid var(--card-border);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }

    .track-card:hover .play-btn {
      border-color: var(--accent);
      color: var(--accent);
    }

    .track-card.active .play-btn {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }

    .track-info {
      min-width: 0;
      flex: 1;
    }

    .track-title {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-desc {
      font-size: 12px;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-right {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
      margin-left: 16px;
    }

    .badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      background: var(--badge-bg);
      color: var(--text-dim);
      font-weight: 500;
    }

    .badge-deleted {
      background: var(--danger-dim);
      color: var(--danger);
      border: 1px solid var(--danger-border);
    }

    .duration {
      font-size: 13px;
      color: var(--text-dim);
      font-variant-numeric: tabular-nums;
      min-width: 38px;
      text-align: right;
    }

    /* Action button: delete / restore */
    .action-btn {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-dim);
      padding: 5px 9px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .action-btn:hover {
      border-color: var(--danger);
      color: var(--danger);
      background: var(--danger-dim);
    }

    .action-btn.btn-restore {
      border-color: var(--accent-dim);
      color: var(--accent);
      background: var(--accent-dim);
    }

    .action-btn.btn-restore:hover {
      border-color: var(--accent);
      background: rgba(197, 168, 128, 0.25);
    }

    /* Equalizer wave icon */
    .eq-wave {
      display: none;
      align-items: flex-end;
      gap: 2px;
      height: 14px;
      width: 14px;
    }

    .track-card.active.playing .eq-wave {
      display: flex;
    }

    .eq-bar {
      width: 2px;
      background: var(--accent);
      border-radius: 1px;
      animation: eq 0.8s ease-in-out infinite alternate;
    }

    .eq-bar:nth-child(1) { height: 40%; animation-delay: 0.1s; }
    .eq-bar:nth-child(2) { height: 90%; animation-delay: 0.3s; }
    .eq-bar:nth-child(3) { height: 60%; animation-delay: 0.2s; }

    @keyframes eq {
      0% { height: 20%; }
      100% { height: 100%; }
    }

    /* Persistent Bottom Player */
    .player-dock {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 72px;
      background: rgba(19, 21, 24, 0.95);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      z-index: 1000;
    }

    .dock-left {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 280px;
    }

    .dock-play {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.15s ease;
    }

    .dock-play:hover {
      transform: scale(1.05);
    }

    .dock-meta h3 {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 210px;
    }

    .dock-meta p {
      font-size: 11px;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 210px;
    }

    .dock-center {
      flex: 1;
      max-width: 520px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .progress-bar-container {
      flex: 1;
      height: 4px;
      background: #252a31;
      border-radius: 2px;
      cursor: pointer;
      position: relative;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
    }

    .time-stamp {
      font-size: 11px;
      color: var(--text-dim);
      font-variant-numeric: tabular-nums;
      min-width: 36px;
    }

    .dock-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .vol-slider {
      width: 80px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      top: 24px;
      right: 24px;
      background: #1d2126;
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      transform: translateY(-20px);
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      z-index: 2000;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="kicker">Bali Bliss Weddings</div>
      <h1>Editorial Audio Suite</h1>
      <p class="subtitle">Bespoke luxury wedding soundtracks, Instagram reel cuts, and solo cello suite movements</p>
      <div class="stats-bar">
        <div>Total: <span id="stat-total">11</span></div>
        <div>Active: <span id="stat-active" class="stat-badge-active">11</span></div>
        <div>Marked Deleted: <span id="stat-deleted" class="stat-badge-deleted">0</span></div>
        <div>Soundtracks: <span id="stat-soundtracks">1</span></div>
        <div>Editorial Stems: <span id="stat-stems">8</span></div>
        <div>Instagram Reels: <span id="stat-reels">2</span></div>
      </div>
    </header>

    <div class="controls">
      <div class="tabs" id="filter-tabs">
        <button class="tab-btn active" data-cat="all">All (<span id="tab-all-count">11</span>)</button>
        <button class="tab-btn" data-cat="active">Active (<span id="tab-active-count">11</span>)</button>
        <button class="tab-btn" data-cat="Soundtracks">Soundtracks (1)</button>
        <button class="tab-btn" data-cat="Editorial Stems">Editorial Stems (8)</button>
        <button class="tab-btn" data-cat="Instagram Reels">Instagram Reels (2)</button>
        <button class="tab-btn tab-deleted" data-cat="deleted">Marked Deleted (<span id="tab-deleted-count">0</span>)</button>
      </div>
      <input type="text" class="search-input" id="search-box" placeholder="Filter audio by name or category...">
    </div>

    <div class="track-grid" id="track-list">
      <!-- Tracks populated via JS -->
    </div>
  </div>

  <!-- Persistent Dock Player -->
  <div class="player-dock" id="player-dock">
    <div class="dock-left">
      <button class="dock-play" id="dock-play-btn">
        <svg id="dock-play-icon" width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <div class="dock-meta">
        <h3 id="dock-title">Select a track</h3>
        <p id="dock-category">Ready</p>
      </div>
    </div>
    <div class="dock-center">
      <span class="time-stamp" id="dock-cur-time">0:00</span>
      <div class="progress-bar-container" id="dock-prog-wrap">
        <div class="progress-fill" id="dock-prog-fill"></div>
      </div>
      <span class="time-stamp" id="dock-dur-time">0:00</span>
    </div>
    <div class="dock-right">
      <svg width="14" height="14" fill="var(--text-dim)" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
      <input type="range" class="vol-slider" id="vol-slider" min="0" max="1" step="0.05" value="0.9">
    </div>
  </div>

  <div class="toast" id="toast-el">Track status updated</div>
  <audio id="global-audio" preload="auto"></audio>

  <script>
    const TRACKS = [{"filename": "bali_bliss_editorial_beat_swipe.m4a", "title": "Beat Swipe", "category": "Editorial Stems", "description": "9.1s clean rhythmic swipe transition", "duration_sec": 9.1, "size_kb": 108.9, "path": "media/audio/bali_bliss_editorial_beat_swipe.m4a", "deleted": false}, {"filename": "bali_bliss_editorial_cello_cue_20s.mp3", "title": "Cello Atmosphere Cue", "category": "Editorial Stems", "description": "20.0s atmospheric cello scene transition", "duration_sec": 20.0, "size_kb": 783.8, "path": "media/audio/bali_bliss_editorial_cello_cue_20s.mp3", "deleted": false}, {"filename": "bali_bliss_editorial_cello_master_full_182s.mp3", "title": "Solitary Cello Suite", "category": "Soundtracks", "description": "182.2s full 3-minute solo cello symphony", "duration_sec": 182.2, "size_kb": 3695.3, "path": "media/audio/bali_bliss_editorial_cello_master_full_182s.mp3", "deleted": false}, {"filename": "bali_bliss_editorial_cello_movement_2.m4a", "title": "Cello Bowed Swell", "category": "Editorial Stems", "description": "22.8s deep atmospheric cello swell", "duration_sec": 22.8, "size_kb": 706.2, "path": "media/audio/bali_bliss_editorial_cello_movement_2.m4a", "deleted": false}, {"filename": "bali_bliss_editorial_cello_movement_4.m4a", "title": "Cello Resonant Cadence", "category": "Editorial Stems", "description": "13.6s rich resonant cello bassline", "duration_sec": 13.6, "size_kb": 425.9, "path": "media/audio/bali_bliss_editorial_cello_movement_4.m4a", "deleted": false}, {"filename": "bali_bliss_editorial_cello_movement_5.m4a", "title": "Cello Sustained Bow", "category": "Editorial Stems", "description": "18.4s cinematic solo cello sustain", "duration_sec": 18.4, "size_kb": 566.3, "path": "media/audio/bali_bliss_editorial_cello_movement_5.m4a", "deleted": false}, {"filename": "bali_bliss_editorial_deep_cello.wav", "title": "Deep Cello Suite", "category": "Editorial Stems", "description": "16.1s harmonic solo cello motif", "duration_sec": 16.1, "size_kb": 2773.6, "path": "media/audio/bali_bliss_editorial_deep_cello.wav", "deleted": false}, {"filename": "bali_bliss_editorial_dhol_celebration.m4a", "title": "Celebration Pulse", "category": "Editorial Stems", "description": "9.4s festive live Indian dhol rhythm", "duration_sec": 9.4, "size_kb": 112.3, "path": "media/audio/bali_bliss_editorial_dhol_celebration.m4a", "deleted": false}, {"filename": "bali_bliss_editorial_dream_dress_7s.m4a", "title": "Couture Dress Reveal", "category": "Instagram Reels", "description": "6.8s couture gown reveal staccato cue", "duration_sec": 6.8, "size_kb": 59.5, "path": "media/audio/bali_bliss_editorial_dream_dress_7s.m4a", "deleted": false}, {"filename": "bali_bliss_editorial_golden_reverie_14s.m4a", "title": "Golden Reverie Accent", "category": "Editorial Stems", "description": "14.4s golden hour romantic acoustic swell", "duration_sec": 14.4, "size_kb": 172.8, "path": "media/audio/bali_bliss_editorial_golden_reverie_14s.m4a", "deleted": false}, {"filename": "bali_bliss_editorial_rakai_bali_vows_26s.m4a", "title": "Uluwatu Ocean Vows", "category": "Instagram Reels", "description": "26.1s authentic Bali cliffside prewedding acoustic guitar & strings", "duration_sec": 26.1, "size_kb": 196.7, "path": "media/audio/bali_bliss_editorial_rakai_bali_vows_26s.m4a", "deleted": false}];
    let currentTrackIndex = -1;
    let isPlaying = false;
    let activeFilter = "all";
    let searchQuery = "";

    const audio = document.getElementById("global-audio");
    const trackListEl = document.getElementById("track-list");
    const dockPlayBtn = document.getElementById("dock-play-btn");
    const dockPlayIcon = document.getElementById("dock-play-icon");
    const dockTitle = document.getElementById("dock-title");
    const dockCategory = document.getElementById("dock-category");
    const dockCurTime = document.getElementById("dock-cur-time");
    const dockDurTime = document.getElementById("dock-dur-time");
    const dockProgWrap = document.getElementById("dock-prog-wrap");
    const dockProgFill = document.getElementById("dock-prog-fill");
    const volSlider = document.getElementById("vol-slider");
    const searchBox = document.getElementById("search-box");
    const tabBtns = document.querySelectorAll(".tab-btn");
    const toastEl = document.getElementById("toast-el");

    // Reset local deleted tracking for pristine 11-track suite
    localStorage.removeItem("bali_bliss_deleted_tracks_v2");

    function getDeletedSet() {
      try {
        const stored = localStorage.getItem("bali_bliss_deleted_tracks_v3");
        return stored ? new Set(JSON.parse(stored)) : new Set();
      } catch (e) {
        return new Set();
      }
    }

    function saveDeletedSet(set) {
      try {
        localStorage.setItem("bali_bliss_deleted_tracks_v3", JSON.stringify(Array.from(set)));
      } catch (e) {}
    }

    const initialDeletedSet = getDeletedSet();
    TRACKS.forEach(t => {
      if (initialDeletedSet.has(t.filename) || t.deleted) {
        t.deleted = true;
        initialDeletedSet.add(t.filename);
      } else {
        t.deleted = false;
      }
    });
    saveDeletedSet(initialDeletedSet);

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      setTimeout(() => {
        toastEl.classList.remove("show");
      }, 2400);
    }

    function updateStats() {
      const deletedCount = TRACKS.filter(t => t.deleted).length;
      const activeCount = TRACKS.length - deletedCount;

      document.getElementById("stat-total").textContent = TRACKS.length;
      document.getElementById("stat-active").textContent = activeCount;
      document.getElementById("stat-deleted").textContent = deletedCount;
      document.getElementById("tab-all-count").textContent = TRACKS.length;
      document.getElementById("tab-active-count").textContent = activeCount;
      document.getElementById("tab-deleted-count").textContent = deletedCount;
    }

    function toggleDeleteTrack(filename) {
      const t = TRACKS.find(tr => tr.filename === filename);
      if (!t) return;

      t.deleted = !t.deleted;
      const deletedSet = getDeletedSet();
      if (t.deleted) {
        deletedSet.add(filename);
        showToast('Marked "' + t.title + '" as deleted');
      } else {
        deletedSet.delete(filename);
        showToast('Restored "' + t.title + '"');
      }
      saveDeletedSet(deletedSet);

      // Persist to server backend
      fetch("/api/mark-deleted", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ filename: filename, deleted: t.deleted })
      }).catch(err => console.log("Local server sync:", err));

      updateStats();
      renderTracks();
    }

    function formatTime(secs) {
      if (!secs || isNaN(secs)) return "0:00";
      const m = Math.floor(secs / 60);
      const s = Math.floor(secs % 60);
      return m + ":" + (s < 10 ? "0" : "") + s;
    }

    function renderTracks() {
      trackListEl.innerHTML = "";
      const filtered = TRACKS.filter((t) => {
        let matchesCat = true;
        if (activeFilter === "all") matchesCat = true;
        else if (activeFilter === "active") matchesCat = !t.deleted;
        else if (activeFilter === "deleted") matchesCat = !!t.deleted;
        else matchesCat = t.category === activeFilter;

        const matchesSearch = !searchQuery || t.title.toLowerCase().includes(searchQuery) || (t.description && t.description.toLowerCase().includes(searchQuery));
        return matchesCat && matchesSearch;
      });

      if (filtered.length === 0) {
        const empty = document.createElement("div");
        empty.style.padding = "32px";
        empty.style.textAlign = "center";
        empty.style.color = "var(--text-dim)";
        empty.style.fontSize = "13px";
        empty.textContent = activeFilter === "deleted" ? "No tracks marked as deleted." : "No audio tracks match your query.";
        trackListEl.appendChild(empty);
        return;
      }

      filtered.forEach((t) => {
        const originalIndex = TRACKS.indexOf(t);
        const isActive = originalIndex === currentTrackIndex;
        const isThisPlaying = isActive && isPlaying;
        const isDeleted = !!t.deleted;

        const card = document.createElement("div");
        card.className = "track-card" + (isActive ? " active" : "") + (isThisPlaying ? " playing" : "") + (isDeleted ? " is-deleted" : "");
        card.onclick = () => playTrack(originalIndex);

        card.innerHTML = `
          <div class="track-left">
            <button class="play-btn" onclick="event.stopPropagation(); playTrack(${originalIndex});" title="Play cue">
              ${isThisPlaying ? 
                '<svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>' : 
                '<svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>'}
            </button>
            <div class="track-info">
              <div class="track-title">${t.title}</div>
              <div class="track-desc">${t.description || ""}</div>
            </div>
          </div>
          <div class="track-right">
            <div class="eq-wave">
              <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
            </div>
            ${isDeleted ? '<span class="badge badge-deleted">Marked Deleted</span>' : '<span class="badge">' + t.category + '</span>'}
            <span class="duration">${formatTime(t.duration_sec)}</span>
            <button class="action-btn ${isDeleted ? "btn-restore" : ""}" 
                    title="${isDeleted ? "Restore track" : "Mark as deleted"}" 
                    onclick="event.stopPropagation(); toggleDeleteTrack('${t.filename}');">
              ${isDeleted ? 
                '<svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"/></svg><span>Restore</span>' : 
                '<svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>'}
            </button>
          </div>
        `;
        trackListEl.appendChild(card);
      });
    }

    function playTrack(idx) {
      if (currentTrackIndex === idx) {
        if (isPlaying) {
          audio.pause();
        } else {
          audio.play();
        }
        return;
      }

      currentTrackIndex = idx;
      const t = TRACKS[idx];
      audio.src = t.path;
      dockTitle.textContent = t.title;
      dockCategory.textContent = t.category + " · " + (t.description || "");
      dockDurTime.textContent = formatTime(t.duration_sec);
      audio.play().catch(e => console.log("Autoplay blocked:", e));
      renderTracks();
    }

    audio.onplay = () => {
      isPlaying = true;
      dockPlayIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
      renderTracks();
    };

    audio.onpause = () => {
      isPlaying = false;
      dockPlayIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
      renderTracks();
    };

    audio.ontimeupdate = () => {
      dockCurTime.textContent = formatTime(audio.currentTime);
      const pct = (audio.currentTime / audio.duration) * 100 || 0;
      dockProgFill.style.width = pct + "%";
    };

    audio.onended = () => {
      let nextIdx = currentTrackIndex + 1;
      while (nextIdx < TRACKS.length && TRACKS[nextIdx].deleted) {
        nextIdx++;
      }
      if (nextIdx < TRACKS.length) {
        playTrack(nextIdx);
      } else {
        isPlaying = false;
        dockPlayIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
        renderTracks();
      }
    };

    dockPlayBtn.onclick = () => {
      if (currentTrackIndex === -1) {
        const firstActive = TRACKS.findIndex(t => !t.deleted);
        playTrack(firstActive !== -1 ? firstActive : 0);
      } else {
        if (isPlaying) audio.pause();
        else audio.play();
      }
    };

    dockProgWrap.onclick = (e) => {
      const rect = dockProgWrap.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const ratio = clickX / rect.width;
      audio.currentTime = ratio * audio.duration;
    };

    volSlider.oninput = () => {
      audio.volume = volSlider.value;
    };

    tabBtns.forEach(btn => {
      btn.onclick = () => {
        tabBtns.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        activeFilter = btn.dataset.cat;
        renderTracks();
      };
    });

    searchBox.oninput = (e) => {
      searchQuery = e.target.value.toLowerCase().trim();
      renderTracks();
    };

    window.addEventListener("keydown", (e) => {
      if (e.target.tagName === "INPUT") return;
      if (e.code === "Space") {
        e.preventDefault();
        dockPlayBtn.click();
      }
    });

    updateStats();
    renderTracks();
  </script>
</body>
</html>
